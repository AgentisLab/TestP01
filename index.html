<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Today in Quebec City</title>
    <meta
      name="description"
      content="Today's weather card for Quebec City: 14 degrees Celsius, partly cloudy."
    />
    <style>
      :root {
        --bg: #f6f8fb;
        --card: #ffffff;
        --ink: #0f172a;
        --muted: #475569;
        --accent: #0284c7;
        --border: #e2e8f0;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--ink);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto,
          "Helvetica Neue", Arial, sans-serif;
        padding: 24px;
      }
      main {
        width: 100%;
        max-width: 420px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 32px;
        box-shadow:
          0 1px 2px rgba(15, 23, 42, 0.04),
          0 12px 32px rgba(15, 23, 42, 0.06);
        text-align: center;
      }
      .label {
        margin: 0 0 4px;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--accent);
      }
      h1 {
        margin: 0 0 24px;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: var(--ink);
      }
      .icon {
        width: 96px;
        height: 96px;
        margin: 0 auto 8px;
        display: block;
      }
      .temp {
        font-size: 72px;
        font-weight: 700;
        line-height: 1;
        letter-spacing: -0.03em;
        color: var(--ink);
      }
      .temp .unit {
        font-size: 28px;
        color: var(--muted);
        font-weight: 500;
        margin-left: 4px;
      }
      .descriptor {
        margin-top: 16px;
        font-size: 20px;
        font-weight: 500;
        color: var(--accent);
      }
      footer {
        margin-top: 24px;
        font-size: 12px;
        color: var(--muted);
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="label">Today</p>
      <h1>Quebec City, Canada</h1>
      <svg
        class="icon"
        viewBox="0 0 64 64"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
      >
        <circle cx="24" cy="24" r="10" fill="#fbbf24" />
        <path
          d="M44 44a10 10 0 0 0-19.5-3.1A8 8 0 1 0 22 56h24a8 8 0 0 0 0-16 8 8 0 0 0-2 4z"
          fill="#cbd5e1"
          stroke="#94a3b8"
          stroke-width="1.5"
          stroke-linejoin="round"
        />
      </svg>
      <div class="temp">14<span class="unit">&deg;C</span></div>
      <div class="descriptor">Partly cloudy</div>
    </main>
    <footer>Static demo &middot; no external data</footer>
  </body>
</html>
